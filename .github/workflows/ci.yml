name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urnight
          POSTGRES_PASSWORD: urnight
          POSTGRES_DB: urnight_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U urnight -d urnight_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: pnpm/action-setup lee `packageManager` del package.json
      # (declarar ambos hace fallar la action con "Multiple versions of pnpm").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @urnight/contracts --filter @urnight/db build

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: API E2E
        run: pnpm --filter @urnight/api test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://urnight:urnight@localhost:5433/urnight_dev
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters

      - name: Build
        run: pnpm -r --if-present build

  # Verifica que las imágenes de los servicios desplegables compilan (§6: build Docker,
  # deploy del monolito + worker como contenedores). Build-only, sin push.
  docker:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web, migrator]
        include:
          # El migrator (migraciones Drizzle) vive junto al package db, no en apps/.
          - app: migrator
            dockerfile: packages/db/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile || format('apps/{0}/Dockerfile', matrix.app) }}
          tags: urnight-${{ matrix.app }}:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

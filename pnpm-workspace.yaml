packages:
  - 'apps/*'
  - 'packages/*'

# Catálogo de versiones compartidas (un único punto de verdad de versiones).
# Las apps referencian con "dep": "catalog:".
catalog:
  # Lenguaje / tooling compartido
  typescript: ~5.6.3
  '@types/node': ^22.10.0
  prettier: ^3.4.2
  eslint: ^9.17.0
  typescript-eslint: ^8.18.2

  # Validación compartida (API ↔ web ↔ móvil)
  zod: ^3.25.76

  # Datos
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.4
  postgres: ^3.4.5

  # Redis / colas
  ioredis: ^5.4.2

  # Object Storage S3 (§1.4 / §5)
  '@aws-sdk/client-s3': ^3.700.0
  '@aws-sdk/s3-request-presigner': ^3.700.0

  # Logging
  pino: ^9.6.0
